{{ define "main" }}
  <article class="post">
    <header class="post-header">
      {{ if eq .Section "posts" }}
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time>
      {{ end }}
      <h1>{{ .Title }}</h1>
    </header>
    <div class="content">{{ .Content }}</div>
  </article>
{{ end }}
