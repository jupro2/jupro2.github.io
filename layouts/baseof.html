<!doctype html>
<html lang="{{ site.Language.Locale }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
    <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
  </head>
  <body>
    <a class="skip-link" href="#content">跳到正文</a>
    <nav class="site-nav" aria-label="主导航">
      {{ $isPost := or .IsHome (eq .Section "posts") }}
      {{ $about := site.GetPage "/about" }}
      <a href="{{ site.Home.RelPermalink }}"{{ if $isPost }} class="active" aria-current="page"{{ end }}>POST</a>
      <a href="{{ $about.RelPermalink }}"{{ if eq .RelPermalink $about.RelPermalink }} class="active" aria-current="page"{{ end }}>ABOUT</a>
    </nav>
    <main id="content">{{ block "main" . }}{{ end }}</main>
  </body>
</html>
