{{ define "main" }}
  <h1 class="visually-hidden">{{ .Title }}</h1>
  <ol class="post-list">
    {{ range .Pages.ByDate.Reverse }}
      <li>
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time>
        <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
      </li>
    {{ else }}
      <li class="empty">还没有文章。</li>
    {{ end }}
  </ol>
{{ end }}
